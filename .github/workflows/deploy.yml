name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Project pages are served from /<repo>/, so Vite needs that base.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Absolute URL for og:image / og:url in link previews.
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          # Monetization stays off unless these repo secrets are set — see
          # README's "Monetization" section for what each one does.
          VITE_ADSENSE_CLIENT: ${{ secrets.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT_HOME: ${{ secrets.VITE_ADSENSE_SLOT_HOME }}
          VITE_ADSENSE_SLOT_RESULTS: ${{ secrets.VITE_ADSENSE_SLOT_RESULTS }}
          VITE_DONATE_URL: ${{ secrets.VITE_DONATE_URL }}
      # Browser-level end-to-end tests against the built site.
      - run: npx playwright@$(node -p "require('playwright-core/package.json').version") install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
